name: Generate Puzzle Bobble Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Puzzle Bobble SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: fauzanhari
          outputs: |
            dist/puzzle-bobble-contribution-graph.svg?palette=github&template=puzzle-bobble
            dist/puzzle-bobble-contribution-graph-dark.svg?palette=github-dark&template=puzzle-bobble
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
